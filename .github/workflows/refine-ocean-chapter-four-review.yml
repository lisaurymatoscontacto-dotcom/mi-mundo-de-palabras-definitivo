name: Refine ocean chapter-four review

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/refine-ocean-chapter-four-review.yml

permissions:
  contents: write

jobs:
  refine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm ci

      - name: Replace weak ocean photo candidates
        run: npx tsx scripts/refine-ocean-chapter-four-review.ts

      - name: Validate staged photo metadata and local files
        run: |
          npm run content:assets:publish
          npm run content:assets:validate
          npm run content:assets:files

      - name: Verify all 16 remain pending and excluded from runtime
        run: |
          node - <<'NODE'
          const fs = require('node:fs');
          const review = JSON.parse(fs.readFileSync('content/asset-reviews/ocean-chapter-four.json', 'utf8'));
          if (review.assets.length !== 16) throw new Error(`Expected 16 review assets, got ${review.assets.length}`);
          if (review.status !== 'pending_visual_review') throw new Error(`Unexpected review status: ${review.status}`);
          if (review.assets.some((asset) => asset.visual_review !== 'pending')) throw new Error('No photo may be approved during replacement staging');
          const catalog = JSON.parse(fs.readFileSync('content/assets.catalog.json', 'utf8'));
          for (const reviewAsset of review.assets) {
            const asset = catalog.assets.find((candidate) => candidate.id === reviewAsset.id);
            if (!asset || asset.review_status !== 'pending_review') throw new Error(`${reviewAsset.id} is not pending_review`);
          }
          NODE
          npm test
          npm run typecheck
          npm run build

      - name: Commit refined pending review batch
        run: |
          rm scripts/refine-ocean-chapter-four-review.ts .github/workflows/refine-ocean-chapter-four-review.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: replace weak ocean photo candidates"
          git pull --rebase origin main
          git push origin main
