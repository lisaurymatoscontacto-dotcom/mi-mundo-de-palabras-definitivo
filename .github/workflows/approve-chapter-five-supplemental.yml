name: Approve chapter-five supplemental photos

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/approve-chapter-five-supplemental.yml

permissions:
  contents: write

jobs:
  approve:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - name: Guarded approval of exactly 10 supplemental photos
        run: npx tsx scripts/approve-chapter-five-supplemental.ts
      - name: Publish and validate approved supplemental metadata
        run: |
          npm run content:assets:publish
          npm run content:assets:validate
          npm run content:assets:files
      - name: Verify supplemental approval contract
        run: |
          node - <<'NODE'
          const fs = require('node:fs');
          const review = JSON.parse(fs.readFileSync('content/asset-reviews/chapter-five-supplemental-photos.json', 'utf8'));
          if (review.status !== 'approved' || review.assets.length !== 10) throw new Error('Expected exactly 10 approved supplemental photos');
          if (review.assets.some((item) => item.visual_review !== 'approved' || !item.review_note || !/^[a-f0-9]{40}$/.test(item.source_canonical_sha1 || ''))) throw new Error('Every supplemental photo must retain canonical audit + approval note');
          const catalog = JSON.parse(fs.readFileSync('content/assets.catalog.json', 'utf8'));
          for (const item of review.assets) {
            const asset = catalog.assets.find((candidate) => candidate.id === item.id);
            if (!asset || asset.review_status !== 'approved' || asset.asset_type !== 'photo') throw new Error(`${item.id} did not become an approved photo`);
          }
          NODE
          npm test
          npm run typecheck
          npm run build
      - name: Commit approved supplemental batch
        run: |
          rm scripts/approve-chapter-five-supplemental.ts .github/workflows/approve-chapter-five-supplemental.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: approve supplemental chapter-five photos"
          git pull --rebase origin main
          git push origin main
