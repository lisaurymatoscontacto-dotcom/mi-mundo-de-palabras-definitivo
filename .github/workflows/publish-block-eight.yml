name: Publish curriculum block eight

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/publish-block-eight.yml

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm ci

      - name: Activate reviewed chapter-three block eight
        run: node scripts/activate-block-eight.mjs

      - name: Materialize reviewed curriculum positions 29-32
        run: npx tsx scripts/materialize-reviewed-curriculum-block.ts --start=29 --count=4

      - name: Publish and validate local asset catalog
        run: |
          npm run content:assets:publish
          npm run content:assets:validate
          npm run content:assets:files

      - name: Verify curriculum through block eight
        run: npx tsx scripts/verify-published-curriculum.ts --chapters=32

      - name: Validate application
        run: |
          npm test
          npm run typecheck
          npm run build

      - name: Commit block eight and remove temporary helpers
        run: |
          rm scripts/activate-block-eight.mjs .github/workflows/publish-block-eight.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: publish second chapter-three curriculum block"
          git pull --rebase origin main
          git push origin main
