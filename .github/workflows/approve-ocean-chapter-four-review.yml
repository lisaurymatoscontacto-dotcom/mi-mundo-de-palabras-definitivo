name: Approve Ocean chapter-four photos

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/approve-ocean-chapter-four-review.yml

permissions:
  contents: write

jobs:
  approve:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm ci

      - name: Apply guarded editorial approval
        run: npx tsx scripts/approve-ocean-chapter-four-review.ts

      - name: Publish and validate approved photo metadata
        run: |
          npm run content:assets:publish
          npm run content:assets:validate
          npm run content:assets:files

      - name: Validate application after approval
        run: |
          npm test
          npm run typecheck
          npm run build

      - name: Commit explicit Ocean 4 photo approval
        run: |
          rm scripts/approve-ocean-chapter-four-review.ts .github/workflows/approve-ocean-chapter-four-review.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: approve Ocean chapter-four photo set"
          git pull --rebase origin main
          git push origin main
