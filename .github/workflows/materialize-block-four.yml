name: Materialize curriculum block four

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/materialize-block-four.yml

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm ci

      # Retry after updating the offline transition-card test so it follows the
      # published bank dynamically instead of assuming Animales is forever 20 cards.
      - name: Activate 64 chapter-two transition cards
        run: node scripts/activate-block-four.mjs

      - name: Materialize 64 reviewed Twemoji resources
        run: npx tsx scripts/materialize-block-four-assets.ts

      - name: Publish and validate local asset catalog
        run: |
          npm run content:assets:publish
          npm run content:assets:validate
          npm run content:assets:files

      - name: Verify curriculum through block four
        run: npx tsx scripts/verify-published-curriculum.ts --chapters=16

      - name: Validate application
        run: |
          npm test
          npm run typecheck
          npm run build

      - name: Commit block four and remove temporary helpers
        run: |
          rm scripts/activate-block-four.mjs scripts/materialize-block-four-assets.ts .github/workflows/materialize-block-four.yml
          rm -f scripts/verify-intro-curriculum.ts
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: publish first chapter-two curriculum block"
          git pull --rebase origin main
          git push origin main
