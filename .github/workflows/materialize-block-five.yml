name: Materialize curriculum block five

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/materialize-block-five.yml

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm ci

      - name: Activate 64 block-five transition cards
        run: node scripts/activate-block-five.mjs

      - name: Materialize 64 reviewed Twemoji resources
        run: npx tsx scripts/materialize-block-five-assets.ts

      - name: Publish and validate local asset catalog
        run: |
          npm run content:assets:publish
          npm run content:assets:validate
          npm run content:assets:files

      - name: Verify curriculum through block five
        run: npx tsx scripts/verify-published-curriculum.ts --chapters=20

      - name: Validate application
        run: |
          npm test
          npm run typecheck
          npm run build

      - name: Commit block five and remove temporary helpers
        run: |
          rm scripts/activate-block-five.mjs scripts/materialize-block-five-assets.ts .github/workflows/materialize-block-five.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: publish second chapter-two curriculum block"
          git pull --rebase origin main
          git push origin main
