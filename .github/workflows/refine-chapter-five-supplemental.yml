name: Refine chapter-five supplemental photos

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/refine-chapter-five-supplemental.yml

permissions:
  contents: write

jobs:
  refine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - name: Refine ARMARIO and audit canonical Commons identities
        run: npx tsx scripts/refine-chapter-five-supplemental.ts
      - name: Publish and validate pending supplemental assets
        run: |
          npm run content:assets:publish
          npm run content:assets:validate
          npm run content:assets:files
      - name: Verify exact pending supplemental contract
        run: |
          node - <<'NODE'
          const fs = require('node:fs');
          const review = JSON.parse(fs.readFileSync('content/asset-reviews/chapter-five-supplemental-photos.json', 'utf8'));
          if (review.status !== 'pending_visual_review' || review.assets.length !== 10) throw new Error('Expected exactly 10 pending supplemental photos');
          if (review.assets.some((item) => item.visual_review !== 'pending' || !/^[a-f0-9]{40}$/.test(item.source_canonical_sha1 || ''))) throw new Error('Every supplemental photo must remain pending with a canonical SHA-1 audit');
          const armario = review.assets.find((item) => item.id === 'casa.armario');
          if (!armario || armario.selected_title !== 'File:Wardrobe MET DP235305.jpg' || armario.license !== 'CC0-1.0') throw new Error('ARMARIO replacement did not land exactly');
          const catalog = JSON.parse(fs.readFileSync('content/assets.catalog.json', 'utf8'));
          for (const item of review.assets) {
            const asset = catalog.assets.find((candidate) => candidate.id === item.id);
            if (!asset || asset.review_status !== 'pending_review' || asset.asset_type !== 'photo') throw new Error(`${item.id} must remain a pending photo`);
          }
          NODE
          npm test
          npm run typecheck
          npm run build
      - name: Commit refined pending supplemental batch
        run: |
          rm scripts/refine-chapter-five-supplemental.ts .github/workflows/refine-chapter-five-supplemental.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: refine supplemental chapter-five photos"
          git pull --rebase origin main
          git push origin main
