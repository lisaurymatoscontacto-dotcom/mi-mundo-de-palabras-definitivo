name: Publish curriculum block nine

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/publish-block-nine.yml

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm ci

      - name: Activate reviewed final chapter-three block
        run: node scripts/activate-block-nine.mjs

      - name: Materialize reviewed curriculum positions 33-36
        run: npx tsx scripts/materialize-reviewed-curriculum-block.ts --start=33 --count=4

      - name: Publish and validate local asset catalog
        run: |
          npm run content:assets:publish
          npm run content:assets:validate
          npm run content:assets:files

      - name: Verify complete chapter-three curriculum
        run: npx tsx scripts/verify-published-curriculum.ts --chapters=36

      - name: Validate application
        run: |
          npm test
          npm run typecheck
          npm run build

      - name: Commit block nine and remove temporary helpers
        run: |
          rm scripts/activate-block-nine.mjs .github/workflows/publish-block-nine.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: publish complete chapter-three curriculum"
          git pull --rebase origin main
          git push origin main
