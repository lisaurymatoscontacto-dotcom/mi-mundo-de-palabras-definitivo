name: Retry ocean chapter-four photos v2

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/retry-ocean-chapter-four-photos-v2.yml

permissions:
  contents: write

jobs:
  stage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm ci

      - name: Refine failed/weak photo searches
        run: node scripts/refine-ocean-photo-staging.mjs

      - name: Replace weak sardine slot
        run: node scripts/replace-sardine-ocean-photo.mjs

      - name: Stage 16 licensed ocean photo candidates
        run: npx tsx scripts/stage-ocean-chapter-four-photos.ts

      - name: Build visual review contact sheet
        run: npx tsx scripts/build-ocean-photo-review-sheet.ts

      - name: Publish metadata and validate staged files
        run: |
          npm run content:assets:publish
          npm run content:assets:validate
          npm run content:assets:files

      - name: Verify pending photos remain excluded from runtime
        run: |
          npm test
          npm run typecheck
          npm run build

      - name: Commit pending photo review batch
        run: |
          rm scripts/stage-ocean-chapter-four-photos.ts scripts/refine-ocean-photo-staging.mjs scripts/replace-sardine-ocean-photo.mjs scripts/build-ocean-photo-review-sheet.ts
          rm .github/workflows/stage-ocean-chapter-four-photos.yml .github/workflows/retry-ocean-chapter-four-photos.yml .github/workflows/retry-ocean-chapter-four-photos-v2.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: stage ocean chapter-four photo candidates"
          git pull --rebase origin main
          git push origin main
