name: Platform Packages
on:
  push:
    branches: [main]
    paths: ['desktop/**', 'scripts/**', 'apps/web/**', 'packages/core/**', 'content/**', 'package*.json', 'capacitor.config.json', 'e2e/**', 'playwright.config.ts', 'INSTALLATION.md', '.github/workflows/platform-build.yml']
  workflow_call:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - run: npm run content:assets:validate && npm run content:assets:files
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-test-report
          path: test-results
  android:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - run: npm run build
      - run: npx cap add android && npx cap sync android
      - run: node scripts/prepare-android.mjs
      - name: Build mobile and TV preview APK
        working-directory: android
        run: chmod +x gradlew && ./gradlew assembleDebug
      - name: Verify TV launcher and bundled photos
        run: |
          APK=android/app/build/outputs/apk/debug/app-debug.apk
          unzip -l "$APK" | grep 'assets/public/content/photos/naturaleza/mar.webp'
          AAPT=$(find "$ANDROID_HOME/build-tools" -name aapt -type f | sort -V | tail -1)
          "$AAPT" dump badging "$APK" > build-apk-info.txt
          grep 'leanback-launchable-activity' build-apk-info.txt
          mkdir -p build/android
          cp "$APK" build/android/mi-mundo-de-palabras-android-tv-preview.apk
          cp INSTALLATION.md build-apk-info.txt build/android/
          cd build/android && sha256sum *.apk > SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: Android-y-Google-TV-APK
          path: build/android/
          if-no-files-found: error
  desktop:
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, platform: win32, arch: x64 }
          - { os: windows-latest, platform: win32, arch: arm64 }
          - { os: ubuntu-latest, platform: linux, arch: x64 }
          - { os: ubuntu-latest, platform: linux, arch: arm64 }
          - { os: macos-latest, platform: darwin, arch: x64 }
          - { os: macos-latest, platform: darwin, arch: arm64 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run build
      - run: node scripts/package-desktop.mjs ${{ matrix.platform }} ${{ matrix.arch }}
      - name: Smoke test packaged Linux app
        if: matrix.platform == 'linux' && matrix.arch == 'x64'
        run: xvfb-run -a node scripts/smoke-desktop.mjs
      - name: Archive preserving executable permissions
        shell: bash
        run: |
          mkdir -p build/download
          if [ "${{ matrix.platform }}" = win32 ]; then
            7z a "build/download/Palabras-${{ matrix.platform }}-${{ matrix.arch }}.zip" "./build/packages/Mi Mundo de Palabras-${{ matrix.platform }}-${{ matrix.arch }}"
          else
            tar -czf "build/download/Palabras-${{ matrix.platform }}-${{ matrix.arch }}.tar.gz" -C build/packages "Mi Mundo de Palabras-${{ matrix.platform }}-${{ matrix.arch }}"
          fi
          cp INSTALLATION.md build/download/
          cd build/download
          shasum -a 256 Palabras-* > SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: Escritorio-${{ matrix.platform }}-${{ matrix.arch }}
          path: build/download/
          if-no-files-found: error
  ios:
    needs: verify
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run build
      - run: npx cap add ios && npx cap sync ios
      - run: node scripts/prepare-ios.mjs
      - name: Build simulator and unsigned device archive
        run: |
          set -o pipefail
          xcodebuild -workspace ios/App/App.xcworkspace -scheme App -configuration Debug -sdk iphonesimulator -derivedDataPath build/ios-simulator CODE_SIGNING_ALLOWED=NO build > simulator-build.log 2>&1 || { tail -100 simulator-build.log; exit 1; }
          xcodebuild -workspace ios/App/App.xcworkspace -scheme App -configuration Release -destination 'generic/platform=iOS' -archivePath build/Palabras-unsigned.xcarchive CODE_SIGNING_ALLOWED=NO archive > device-build.log 2>&1 || { tail -100 device-build.log; exit 1; }
          mkdir -p build/apple
          tar -czf build/apple/iOS-Simulator.tar.gz -C build/ios-simulator/Build/Products/Debug-iphonesimulator App.app
          tar -czf build/apple/iOS-Device-UNSIGNED.tar.gz -C build Palabras-unsigned.xcarchive
          cp INSTALLATION.md build/apple/
          cd build/apple && shasum -a 256 *.tar.gz > SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: Apple-iOS-simulator-y-archivo-sin-firma
          path: build/apple/
          if-no-files-found: error
  web:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci && npm run build
      - run: cp INSTALLATION.md apps/web/dist/
      - uses: actions/upload-artifact@v4
        with:
          name: Web-PWA-para-alojamiento-HTTPS
          path: apps/web/dist/
          if-no-files-found: error
