name: Harden Twemoji importer

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/harden-twemoji-importer.yml

permissions:
  contents: write

jobs:
  harden:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm ci

      - name: Apply guarded importer patch
        run: node scripts/apply-twemoji-importer-hardening.mjs

      - name: Validate shared Twemoji resolver and importer build
        run: |
          npm test
          npm run typecheck
          npm run content:assets:validate
          npm run content:assets:files
          npm run content:curriculum:verify
          npm run build

      - name: Commit hardened importer and remove temporary helpers
        run: |
          rm scripts/apply-twemoji-importer-hardening.mjs .github/workflows/harden-twemoji-importer.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: harden Twemoji importer for variation selectors"
          git pull --rebase origin main
          git push origin main
