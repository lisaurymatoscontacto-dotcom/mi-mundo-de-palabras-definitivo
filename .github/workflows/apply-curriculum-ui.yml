name: Apply curriculum UI migration

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/apply-curriculum-ui.yml

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm ci

      - name: Apply guarded App migration
        run: node scripts/apply-curriculum-ui-migration.mjs

      - name: Repair validated completion JSX anchor
        run: |
          node --input-type=module <<'NODE'
          import { readFile, writeFile } from 'node:fs/promises';
          const path = 'apps/web/src/App.tsx';
          let source = await readFile(path, 'utf8');
          const before = '{evaluation.passed && !completedChapter && sessionLevel < 48 && <div className="next-level"><small>Siguiente</small><strong>Nivel {sessionLevel + 1}: {next.name}</strong></div>\n          {!evaluation.passed';
          const after = '{evaluation.passed && !completedChapter && sessionLevel < 48 && <div className="next-level"><small>Siguiente</small><strong>Nivel {sessionLevel + 1}: {next.name}</strong></div>}\n          {!evaluation.passed';
          if (!source.includes(before)) throw new Error('Expected completion JSX repair anchor not found');
          source = source.replace(before, after);
          await writeFile(path, source, 'utf8');
          NODE

      - name: Validate curriculum UI
        run: |
          npm test
          npm run typecheck
          npm run content:assets:validate
          npm run content:assets:files
          npm run build

      - name: Commit migration and remove temporary migration helpers
        run: |
          rm scripts/apply-curriculum-ui-migration.mjs .github/workflows/apply-curriculum-ui.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: replace prototype levels with themed curriculum path"
          git pull --rebase origin main
          git push origin main
