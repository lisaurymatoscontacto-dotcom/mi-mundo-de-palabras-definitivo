name: Refine Space chapter-four review

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/refine-space-chapter-four-review.yml

permissions:
  contents: write

jobs:
  refine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - name: Replace five weak Space candidates
        run: npx tsx scripts/refine-space-chapter-four-review.ts
      - name: Validate refined pending batch
        run: |
          npm run content:assets:publish
          npm run content:assets:validate
          npm run content:assets:files
          node - <<'NODE'
          const fs = require('node:fs');
          const review = JSON.parse(fs.readFileSync('content/asset-reviews/space-chapter-four.json', 'utf8'));
          if (review.assets.length !== 16 || review.status !== 'pending_visual_review') throw new Error('Space review batch shape/status changed unexpectedly');
          if (review.assets.some((asset) => asset.visual_review !== 'pending')) throw new Error('Refinement must not approve Space photos');
          NODE
          npm test
          npm run typecheck
          npm run build
      - name: Commit refined pending Space batch
        run: |
          rm scripts/refine-space-chapter-four-review.ts .github/workflows/refine-space-chapter-four-review.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: replace weak Space photo candidates"
          git pull --rebase origin main
          git push origin main
