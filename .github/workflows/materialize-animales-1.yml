name: Materialize Animales 1

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/materialize-animales-1.yml

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm ci

      - name: Queue the fourteen missing Animales 1 concepts
        run: >-
          npm run content:assets:queue --
          --limit=14
          --ids=animales.perro,animales.pez,animales.oso,animales.leon,animales.tigre,animales.conejo,animales.caballo,animales.cerdo,animales.oveja,animales.cabra,animales.raton,animales.zorro,animales.abeja,animales.aranya

      - name: Materialize reviewed Twemoji candidates locally
        run: >-
          npm run content:assets:import --
          --no-queue
          --limit=14
          --ids=animales.perro,animales.pez,animales.oso,animales.leon,animales.tigre,animales.conejo,animales.caballo,animales.cerdo,animales.oveja,animales.cabra,animales.raton,animales.zorro,animales.abeja,animales.aranya

      - name: Validate local resources before editorial approval
        run: npm run content:assets:validate && npm run content:assets:files

      - name: Approve direct one-concept animal emoji representations
        run: >-
          npm run content:assets:review --
          --ids=animales.perro,animales.pez,animales.oso,animales.leon,animales.tigre,animales.conejo,animales.caballo,animales.cerdo,animales.oveja,animales.cabra,animales.raton,animales.zorro,animales.abeja,animales.aranya
          --status=approved
          --note="Animales 1 controlled review: direct Twemoji representation matches one unambiguous animal concept; local CC-BY-4.0 asset and provenance verified."

      - name: Publish and validate catalog
        run: |
          npm run content:assets:publish
          npm run content:assets:validate
          npm run content:assets:files
          npm test
          npm run typecheck
          npm run build

      - name: Commit generated Animales 1 assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content/assets.catalog.json apps/web/public/content/assets.catalog.json apps/web/public/content/emoji/twemoji
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "feat: materialize approved Animales 1 visual assets"
            git pull --rebase origin main
            git push origin main
          fi
