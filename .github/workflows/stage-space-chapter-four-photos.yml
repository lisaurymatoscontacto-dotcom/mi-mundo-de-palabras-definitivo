name: Stage Space chapter-four photos

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/stage-space-chapter-four-photos.yml

permissions:
  contents: write

jobs:
  stage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - name: Stage 16 legal Space photo candidates
        run: npx tsx scripts/stage-space-chapter-four-photos.ts
      - name: Publish metadata and validate staged files
        run: |
          npm run content:assets:publish
          npm run content:assets:validate
          npm run content:assets:files
      - name: Verify pending photos remain excluded
        run: |
          node - <<'NODE'
          const fs = require('node:fs');
          const review = JSON.parse(fs.readFileSync('content/asset-reviews/space-chapter-four.json', 'utf8'));
          if (review.assets.length !== 16) throw new Error(`Expected 16 review assets, got ${review.assets.length}`);
          if (review.status !== 'pending_visual_review') throw new Error(`Unexpected review status: ${review.status}`);
          if (review.assets.some((asset) => asset.visual_review !== 'pending')) throw new Error('No Space photo may be auto-approved');
          const catalog = JSON.parse(fs.readFileSync('content/assets.catalog.json', 'utf8'));
          for (const item of review.assets) {
            const asset = catalog.assets.find((candidate) => candidate.id === item.id);
            if (!asset || asset.review_status !== 'pending_review') throw new Error(`${item.id} must remain pending_review`);
          }
          NODE
          npm test
          npm run typecheck
          npm run build
      - name: Commit pending Space review batch
        run: |
          rm scripts/stage-space-chapter-four-photos.ts .github/workflows/stage-space-chapter-four-photos.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: stage Space chapter-four photo candidates"
          git pull --rebase origin main
          git push origin main
