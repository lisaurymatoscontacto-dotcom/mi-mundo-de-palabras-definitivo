name: Upgrade mixed curriculum publisher

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/upgrade-mixed-curriculum-publisher.yml

permissions:
  contents: write

jobs:
  upgrade:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm ci

      - name: Apply guarded mixed-publisher patch
        run: node scripts/upgrade-mixed-curriculum-publisher.mjs

      - name: Smoke-test existing emoji publication path
        run: |
          npx tsx scripts/materialize-reviewed-curriculum-block.ts --start=41 --count=1
          git checkout -- content/assets.catalog.json

      - name: Validate application and asset pipeline
        run: |
          npm run content:assets:validate
          npm run content:assets:files
          npm test
          npm run typecheck
          npm run build

      - name: Commit publisher upgrade and remove temporary helpers
        run: |
          rm scripts/upgrade-mixed-curriculum-publisher.mjs .github/workflows/upgrade-mixed-curriculum-publisher.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: support pre-approved photos in curriculum publisher"
          git pull --rebase origin main
          git push origin main
