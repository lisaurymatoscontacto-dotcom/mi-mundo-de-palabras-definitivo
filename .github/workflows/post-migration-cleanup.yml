name: Post-migration cleanup

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/post-migration-cleanup.yml

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm ci

      - name: Apply guarded cleanup
        run: node scripts/post-migration-cleanup.mjs

      - name: Validate repository after cleanup
        run: |
          npm test
          npm run typecheck
          npm run content:assets:validate
          npm run content:assets:files
          npm run build

      - name: Commit cleanup and remove obsolete migration helpers
        run: |
          rm scripts/post-migration-cleanup.mjs .github/workflows/post-migration-cleanup.yml .github/workflows/prepare-repo-migration.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: finish repository migration cleanup"
          git pull --rebase origin main
          git push origin main
