name: Export ocean review sheet

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/export-ocean-review-sheet.yml

permissions:
  contents: write

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Upload visual review sheet
        uses: actions/upload-artifact@v4
        with:
          name: ocean-chapter-four-review-sheet
          path: content/asset-reviews/ocean-chapter-four-contact.webp
          retention-days: 1

      - name: Remove temporary exporter
        run: |
          rm .github/workflows/export-ocean-review-sheet.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: remove temporary ocean review exporter"
          git pull --rebase origin main
          git push origin main
