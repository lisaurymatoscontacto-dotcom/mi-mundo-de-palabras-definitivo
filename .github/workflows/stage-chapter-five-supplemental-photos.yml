name: Stage chapter-five supplemental photos

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/stage-chapter-five-supplemental-photos.yml

permissions:
  contents: write

jobs:
  stage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - name: Stage exact supplemental photo set
        run: npx tsx scripts/stage-chapter-five-supplemental-photos.ts
      - name: Publish and validate pending metadata
        run: |
          npm run content:assets:publish
          npm run content:assets:validate
          npm run content:assets:files
      - name: Verify all ten remain pending
        run: |
          node - <<'NODE'
          const fs = require('node:fs');
          const review = JSON.parse(fs.readFileSync('content/asset-reviews/chapter-five-supplemental-photos.json', 'utf8'));
          if (review.status !== 'pending_visual_review' || review.assets.length !== 10) throw new Error('Expected ten pending supplemental photos');
          if (review.assets.some((item) => item.visual_review !== 'pending')) throw new Error('No supplemental photo may be auto-approved');
          const categoryCounts = review.assets.reduce((acc, item) => { acc[item.category] = (acc[item.category] || 0) + 1; return acc; }, {});
          if (categoryCounts.Casa !== 6 || categoryCounts.Comida !== 4) throw new Error(`Unexpected category counts: ${JSON.stringify(categoryCounts)}`);
          const catalog = JSON.parse(fs.readFileSync('content/assets.catalog.json', 'utf8'));
          const counts = catalog.assets.reduce((acc, asset) => { acc[asset.review_status] = (acc[asset.review_status] || 0) + 1; return acc; }, {});
          if (counts.approved !== 841 || counts.pending_review !== 10 || counts.rejected !== 1) throw new Error(`Unexpected catalog status counts: ${JSON.stringify(counts)}`);
          for (const item of review.assets) {
            const asset = catalog.assets.find((candidate) => candidate.id === item.id);
            if (!asset || asset.review_status !== 'pending_review' || asset.asset_type !== 'photo') throw new Error(`${item.id} must remain a pending photo`);
          }
          NODE
          npm test
          npm run typecheck
          npm run build
      - name: Commit pending supplemental batch
        run: |
          rm scripts/stage-chapter-five-supplemental-photos.ts .github/workflows/stage-chapter-five-supplemental-photos.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: stage chapter-five supplemental photos"
          git pull --rebase origin main
          git push origin main
