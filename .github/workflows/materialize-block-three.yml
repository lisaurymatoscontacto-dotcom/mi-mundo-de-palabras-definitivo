name: Materialize curriculum block three

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/materialize-block-three.yml

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm ci

      - name: Materialize 80 reviewed block-three Twemoji resources
        run: npx tsx scripts/materialize-block-three-assets.ts

      - name: Publish and validate local asset catalog
        run: |
          npm run content:assets:publish
          npm run content:assets:validate
          npm run content:assets:files

      - name: Verify all twelve introductory chapters are complete
        run: npx tsx scripts/verify-intro-curriculum.ts

      - name: Validate application
        run: |
          npm test
          npm run typecheck
          npm run build

      - name: Commit completed introductory cycle
        run: |
          rm scripts/materialize-block-three-assets.ts .github/workflows/materialize-block-three.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: complete all twelve introductory curriculum chapters"
          git pull --rebase origin main
          git push origin main
