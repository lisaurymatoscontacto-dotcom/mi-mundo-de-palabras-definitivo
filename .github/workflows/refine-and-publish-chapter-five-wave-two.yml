name: Refine and publish chapter-five wave two

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/refine-and-publish-chapter-five-wave-two.yml

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - name: Apply reviewed chapter-five curriculum refinements
        run: npx tsx scripts/refine-and-publish-chapter-five-wave-two.ts --apply
      - name: Validate refined curriculum before publishing cards
        run: |
          npm test
          npm run typecheck
          npm run content:curriculum:verify
          npm run content:build:lexicon
      - name: Publish seven already-approved photo concepts
        run: npx tsx scripts/refine-and-publish-chapter-five-wave-two.ts --publish
      - name: Validate assets and application after publication
        run: |
          npm run content:assets:publish
          npm run content:assets:validate
          npm run content:assets:files
          npm test
          npm run typecheck
          npm run content:curriculum:verify
          npm run build
      - name: Recompute objective readiness in a fresh process
        run: npx tsx scripts/refine-and-publish-chapter-five-wave-two.ts --verify
      - name: Verify readiness reached exactly 27 of 64
        run: |
          node - <<'NODE'
          const fs = require('node:fs');
          const report = JSON.parse(fs.readFileSync('content/audits/chapter-five-readiness.json','utf8'));
          if (report.total_concepts !== 64 || report.ready_concepts !== 27 || report.ready_percent < 42.1) throw new Error(`Unexpected readiness: ${report.ready_concepts}/${report.total_concepts} (${report.ready_percent}%)`);
          const expected = { Animales: 4, Casa: 6, Comida: 7, Naturaleza: 10 };
          for (const [category,count] of Object.entries(expected)) {
            const world = report.worlds.find((item) => item.category === category);
            if (!world || world.ready !== count) throw new Error(`${category} expected ${count} ready, got ${world?.ready}`);
          }
          NODE
      - name: Commit wave two and semantic curriculum refinement
        run: |
          rm scripts/refine-and-publish-chapter-five-wave-two.ts .github/workflows/refine-and-publish-chapter-five-wave-two.yml
          rm -f packages/core/src/generated/lexicon.candidate.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: refine and publish chapter-five wave two"
          git pull --rebase origin main
          git push origin main
